<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.8)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bgGrad)" />

  <!-- Network Mesh Lines -->
  <g stroke="rgba(99, 102, 241, 0.15)" stroke-width="1.5">
    <line x1="50" y1="100" x2="300" y2="250" />
    <line x1="300" y1="250" x2="550" y2="150" />
    <line x1="300" y1="250" x2="200" y2="500" />
    <line x1="200" y1="500" x2="450" y2="550" />
    <line x1="450" y1="550" x2="550" y2="350" />
    <line x1="50" y1="400" x2="200" y2="500" />
  </g>

  <!-- Nodes -->
  <circle cx="300" cy="250" r="12" fill="#6366f1" filter="url(#glow)" />
  <circle cx="200" cy="500" r="10" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="450" cy="550" r="10" fill="#a855f7" filter="url(#glow)" />

  <!-- Badge Top -->
  <rect x="50" y="60" width="160" height="32" rx="16" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="1" />
  <text x="130" y="81" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">CISCO CERTIFIED</text>

  <!-- Title -->
  <text x="50" y="150" fill="url(#accentGrad)" font-family="Prompt, sans-serif" font-size="44" font-weight="800">CCNA 200-301</text>
  <text x="50" y="190" fill="#ffffff" font-family="Prompt, sans-serif" font-size="22" font-weight="700">v1.2 Network Master Guide</text>
  <text x="50" y="215" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Complete Interactive Blueprint &amp; Command Reference</text>

  <!-- Central Diagram Box -->
  <rect x="50" y="280" width="500" height="340" rx="16" fill="url(#cardGrad)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1.5" />

  <!-- OSI 7 Layers Interactive Teaser Inside Box -->
  <text x="80" y="320" fill="#38bdf8" font-family="Inter, sans-serif" font-size="13" font-weight="700">OSI 7 LAYERS VS TCP/IP PROTOCOL SUITE</text>
  
  <rect x="80" y="340" width="440" height="36" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="#334155" />
  <text x="100" y="363" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12" font-weight="600">L7-L5 Application / Presentation / Session (Data PDU)</text>

  <rect x="80" y="386" width="440" height="36" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="#334155" />
  <text x="100" y="409" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12" font-weight="600">L4 Transport: Segment PDU (TCP/UDP Ports: 443, 80, 22)</text>

  <rect x="80" y="432" width="440" height="36" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="#6366f1" stroke-width="1.5" />
  <text x="100" y="455" fill="#818cf8" font-family="Inter, sans-serif" font-size="12" font-weight="700">L3 Network: Packet PDU (IPv4/IPv6 Routing &amp; ICMP)</text>

  <rect x="80" y="478" width="440" height="36" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="#334155" />
  <text x="100" y="501" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12" font-weight="600">L2 Data Link: Frame PDU (VLANs, 802.1Q, STP, MAC)</text>

  <rect x="80" y="524" width="440" height="36" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="#334155" />
  <text x="100" y="547" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12" font-weight="600">L1 Physical: Bits (Fiber Optics, UTP, SFP Transceivers)</text>

  <!-- CLI Code Teaser Pill -->
  <rect x="80" y="570" width="440" height="32" rx="6" fill="#090d16" />
  <text x="100" y="591" fill="#4ade80" font-family="monospace" font-size="11">Switch(config)# interface vlan 10 &amp;&amp; ip address 192.168.10.1</text>

  <!-- Footer Tagline -->
  <text x="300" y="670" fill="#ffffff" font-family="Prompt, sans-serif" font-size="18" font-weight="700" text-anchor="middle">ระบบอ่านแบบโต้ตอบ (Interactive E-Reader)</text>
  <text x="300" y="695" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">สไลด์สรุปเนื้อหา + CLI Lab Simulator + แบบทดสอบ Quiz พร้อมวัดผล</text>

  <line x1="50" y1="730" x2="550" y2="730" stroke="rgba(255,255,255,0.1)" />
  <text x="300" y="760" fill="#64748b" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">© 2026 STUDYROAD TECH LEARNING PLATFORM</text>
</svg>
